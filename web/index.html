<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#000000" />
    <meta name="color-scheme" content="dark" />
    <meta
      name="description"
      content="Ambiance — cabin lighting for the Innova Hycross."
    />
    <title>Ambiance</title>
    <!-- Fonts are bundled with the app (see src/main.jsx) so the interface
         renders correctly with no network. -->
    <style>
      /* Paint black before any CSS loads so a cold start never flashes white */
      html,
      body,
      #root {
        background: #000;
        margin: 0;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
