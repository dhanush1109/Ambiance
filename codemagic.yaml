# Builds an Ambiance .ipa on Codemagic (macOS) for SideStore sideloading.
# SideStore re-signs the IPA with your Apple ID on the phone — no App Store Connect needed.
workflows:
  ambiance-ios-sidestore:
    name: Ambiance iOS (SideStore IPA)
    max_build_duration: 60
    instance_type: mac_mini_m2
    working_directory: web
    environment:
      node: 22
      xcode: latest
      cocoapods: default
      vars:
        XCODE_WORKSPACE: App.xcworkspace
        XCODE_SCHEME: App
        BUNDLE_ID: com.ambiance.hycross
    scripts:
      - name: Install npm dependencies
        script: |
          # Lockfile was generated on Windows; npm ci skips other-OS optional
          # deps (e.g. @rollup/rollup-darwin-arm64). Fresh install on the Mac
          # runner, then pin the Rollup native binary explicitly.
          rm -rf node_modules
          npm install
          npm install --no-save @rollup/rollup-darwin-arm64
      - name: Build web assets
        script: |
          npm run build
      - name: Sync Capacitor iOS
        script: |
          npx cap sync ios
      - name: Install CocoaPods
        script: |
          cd ios/App
          pod install
      - name: Build unsigned IPA for SideStore
        script: |
          set -euo pipefail
          cd ios/App
          ARCHIVE_PATH="$CM_BUILD_DIR/web/build/Ambiance.xcarchive"
          IPA_DIR="$CM_BUILD_DIR/web/build/ipa"
          mkdir -p "$IPA_DIR" "$CM_EXPORT_DIR"

          xcodebuild \
            -workspace "$XCODE_WORKSPACE" \
            -scheme "$XCODE_SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -archivePath "$ARCHIVE_PATH" \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM="" \
            archive

          APP_PATH=$(find "$ARCHIVE_PATH/Products/Applications" -name "*.app" | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "No .app found in archive"
            find "$ARCHIVE_PATH" -maxdepth 4 -print || true
            exit 1
          fi

          rm -rf Payload
          mkdir Payload
          cp -R "$APP_PATH" Payload/
          # IPA must end with .ipa for Codemagic to list it separately
          ditto -c -k --sequesterRsrc --keepParent Payload "$IPA_DIR/Ambiance.ipa" || zip -qr "$IPA_DIR/Ambiance.ipa" Payload
          rm -rf Payload

          cp "$IPA_DIR/Ambiance.ipa" "$CM_BUILD_DIR/Ambiance.ipa"
          cp "$IPA_DIR/Ambiance.ipa" "$CM_EXPORT_DIR/Ambiance.ipa"

          echo "IPA ready:"
          ls -lh "$IPA_DIR/Ambiance.ipa" "$CM_BUILD_DIR/Ambiance.ipa" "$CM_EXPORT_DIR/Ambiance.ipa"
          # Fail loudly if the package is empty / missing
          test -s "$CM_BUILD_DIR/Ambiance.ipa"
    artifacts:
      - Ambiance.ipa
      - web/build/ipa/*.ipa
      - $CM_BUILD_DIR/Ambiance.ipa
      - $CM_BUILD_DIR/web/build/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      email:
        recipients:
          - dhanushdevadiga1109@gmail.com
        notify:
          success: true
          failure: true
