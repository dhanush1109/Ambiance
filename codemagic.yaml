# Builds an Ambiance .ipa on Codemagic (macOS) for SideStore sideloading.
# SideStore re-signs the IPA with your Apple ID on the phone — no App Store Connect needed.
workflows:
  ambiance-ios-sidestore:
    name: Ambiance iOS (SideStore IPA)
    max_build_duration: 60
    instance_type: mac_mini_m2
    working_directory: web
    environment:
      node: 22
      xcode: latest
      cocoapods: default
      vars:
        XCODE_WORKSPACE: App.xcworkspace
        XCODE_SCHEME: App
        BUNDLE_ID: com.ambiance.hycross
    scripts:
      - name: Install npm dependencies
        script: |
          npm ci
      - name: Build web assets
        script: |
          npm run build
      - name: Sync Capacitor iOS
        script: |
          npx cap sync ios
      - name: Install CocoaPods
        script: |
          cd ios/App
          pod install
      - name: Build unsigned IPA for SideStore
        script: |
          set -e
          cd ios/App
          ARCHIVE_PATH="$CM_BUILD_DIR/web/build/Ambiance.xcarchive"
          IPA_DIR="$CM_BUILD_DIR/web/build/ipa"
          mkdir -p "$IPA_DIR"

          xcodebuild \
            -workspace "$XCODE_WORKSPACE" \
            -scheme "$XCODE_SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -archivePath "$ARCHIVE_PATH" \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM="" \
            archive

          APP_PATH=$(find "$ARCHIVE_PATH/Products/Applications" -name "*.app" | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "No .app found in archive"
            exit 1
          fi

          rm -rf Payload
          mkdir Payload
          cp -R "$APP_PATH" Payload/
          zip -qr "$IPA_DIR/Ambiance.ipa" Payload
          rm -rf Payload
          echo "IPA ready: $IPA_DIR/Ambiance.ipa"
          ls -lh "$IPA_DIR/Ambiance.ipa"
    artifacts:
      - web/build/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      email:
        recipients:
          - dhanushdevadiga1109@gmail.com
        notify:
          success: true
          failure: true
